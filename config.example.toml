# AmoreOcarinaSniper configuration (copy to config.toml; config.local.* is gitignored)
#
# Nothing in this file authorizes a purchase by itself. The purchaser only acts when
# `ocarina arm` has been run explicitly, the armed session has not expired, and every
# policy check below passes against what the browser actually reads at checkout.

[paths]
# Runtime directory: SQLite state, process lock, kill switch, telemetry logs.
data_dir = "./runtime"
# Dedicated persistent Chromium profile (Amazon login lives here). Never commit.
browser_profile_dir = "./profiles/amazon"
# Pairing secret shared with the extension. Generated by `ocarina pair`. Never commit.
bridge_secret_file = "./secrets/bridge_secret"

[bridge]
# The bridge only ever binds 127.0.0.1; this is not configurable on purpose.
port = 48620
# Trigger payloads larger than this are rejected before parsing.
max_body_bytes = 8192
# `sent_at` (extension wall clock) must be within this many seconds of our wall clock.
clock_skew_tolerance_s = 30
# Rendered Discord timestamp must be at most this old when the trigger arrives.
message_freshness_s = 90
# Optional: restrict Origin to your unpacked extension id once you know it, e.g.
# "chrome-extension://abcdefghijklmnopabcdefghijklmnop". Empty = accept any
# chrome-extension:// origin (still requires the pairing secret).
allowed_extension_origin = ""

[target]
asin = "B0HJ6F8L6V"
url = "https://www.amazon.ca/dp/B0HJ6F8L6V"
# The product title on the page must contain all of these (after normalization).
title_must_contain = ["nintendo switch 2", "legend of zelda", "40th anniversary"]
# Identifier the extension sends as `matched_target`; must match exactly.
target_id = "switch2-zelda-40th"
# Optional defence in depth: only accept triggers reporting this Discord channel id.
discord_channel_id = ""

[policy]
# CAD. Decimal strings, never floats.
max_item_price = "0.00"          # <-- set deliberately; 0.00 blocks every purchase
max_total = "0.00"               # item + tax + shipping + fees, as shown on the review page
currency = "CAD"
quantity = 1
condition = "new"
# Allowed sellers (normalized, case-insensitive). Typical: ["amazon.ca", "amazon"]
allowed_sellers = ["amazon.ca"]
# Fulfillment requirement: "amazon" (Ships from Amazon) or "any". When the page shows no
# "Ships from" row at all, Amazon-as-seller is accepted (Amazon retail ships its own offers);
# any other seller without an explicit "Ships from Amazon" fails closed.
fulfillment = "amazon"
# Accept pre-order listings ("This item will be released on <date>. Pre-order now.").
# Off by default: a pre-order commits you to buy on release. Observed live 2026-09-25.
allow_preorder = false
# Substring that must appear in the shipping address block shown at checkout
# (e.g. a street number + name fragment you recognise). Empty = fail closed.
approved_address_contains = ""
# Substring that must appear in the payment method block (e.g. "ending in 1234").
approved_payment_contains = ""
# Default armed-session duration for `ocarina arm` when --minutes is omitted.
default_arm_minutes = 120
# Hard ceiling for any armed session.
max_arm_minutes = 720

[checkout]
# "buy_now" (preferred, if the Buy Now path exposes all policy fields) or "cart"
strategy = "buy_now"
# Bounded waits (ms). No arbitrary sleeps; these are upper bounds for readiness conditions.
navigation_timeout_ms = 15000
element_timeout_ms = 8000
confirmation_timeout_ms = 20000
# Optional resource blocking (images/fonts/media). Benchmarked 2026-09-25: no measurable gain
# because verification already stops at DOMContentLoaded. Leave off.
block_heavy_assets = false

[watch]
# Second trigger source: while ARMED, Python re-reads the product page itself on a second
# tab every `interval_s` seconds (±20 % jitter) and starts the normal verified checkout
# when the page shows an offer the policy would accept. Closes the gap between Amazon
# flipping the listing and the Discord alert being posted. Costs 2–3 signed-in requests a
# minute; interval_s below 10 is refused. Off by default.
enabled = false
interval_s = 30
# After a watcher-triggered attempt that did not purchase, wait this long before the
# watcher may trigger again (the Discord path is unaffected).
retrigger_cooldown_s = 120

[notify]
# Optional push notifications to your phone via ntfy (https://ntfy.sh, free, no account):
# install the ntfy app, subscribe to a long random topic name, put the same name here, then
# run `ocarina notify-test`. Sent after an attempt ends (never during): ORDER PLACED,
# stock seen but REFUSED (go manual), NEEDS_ATTENTION / UNKNOWN, first Amazon challenge on
# the watch tab, runner (re)started. Messages carry state + policy reasons only.
ntfy_topic = ""
ntfy_server = "https://ntfy.sh"

[telemetry]
# JSON-lines telemetry under data_dir/logs
enabled = true
verbose = false
